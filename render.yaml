services:
  - type: web
    name: algeria-wander-api
    runtime: python
    pythonVersion: 3.11
    buildCommand: >
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      python backend/manage.py collectstatic --noinput &&
      python backend/manage.py migrate
    startCommand: gunicorn project_name.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --worker-class sync
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: USE_SQLITE
        value: "False"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: "yourdomain.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://yourdomain.com,https://yourfrontend.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: DATABASE_URL
        sync: false

  - type: postgres
    name: algeria-wander-db
    version: 15
    ipAllowList: []
    plan: starter
