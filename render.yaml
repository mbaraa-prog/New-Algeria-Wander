services:
  - type: web
    name: algeria-wander-api
    runtime: python
    pythonVersion: 3.11
    buildCommand: >
      pip install --upgrade pip &&
      pip install -r backend/requirements.txt &&
      python backend/manage.py collectstatic --noinput &&
      python backend/manage.py migrate &&
      python backend/manage.py load_algeria_data --file-path backend/algeria_data.json
    startCommand: gunicorn project_name.wsgi:application --bind 0.0.0.0:$PORT --workers 4
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: "algeria-wander-hods.onrender.com,.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://algeria-wander.vercel.app"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: DATABASE_URL
        sync: false

  - type: postgres
    name: algeria-wander-db
    version: 15
    ipAllowList: []
    plan: starter
